<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Weight Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen text-gray-800">

    <div class="max-w-7xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold mb-2">Weight Tracker</h1>
            <p class="text-gray-600">Log your daily weight, view week-by-week averages, and track progress by month.</p>
        </header>

        <!-- Quick Navigation Bar (Sticky Header) -->
        <div class="sticky top-2 z-10 bg-white/95 backdrop-blur shadow-md border border-gray-200 rounded-xl p-3 mb-6 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2 overflow-x-auto py-1 max-w-full" id="monthQuickNav">
                <!-- Month pill buttons will be dynamically generated here -->
            </div>
            
            <div class="flex items-center gap-2 text-sm">
                <button onclick="scrollToCurrentWeek()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition font-medium text-xs flex items-center gap-1 shadow-sm">
                    🎯 Jump to Today/Current Week
                </button>
                <button onclick="toggleAllMonths()" id="toggleAllBtn" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium text-xs">
                    📁 Collapse All
                </button>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div>
                <span class="font-medium text-gray-700">Starting Date: </span>
                <span id="baseDateDisplay" class="font-bold text-blue-600">October 11, 2026</span>
            </div>
            <div class="flex gap-3">
                <button onclick="changeWeeksCount(4)" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium text-sm shadow">+ Add 4 Weeks</button>
                <button onclick="resetData()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition font-medium text-sm">Reset Data</button>
            </div>
        </div>

        <!-- Container for Month Groups -->
        <div id="monthsContainer" class="space-y-6">
            <!-- Dynamically populated month sections will go here -->
        </div>
    </div>

    <script>
        // Configuration: Start date requested is Oct 11, 2026
        const baseDate = new Date(2026, 9, 11); // Month is 0-indexed (9 = October)
        let totalWeeks = 12; // Default showing 12 weeks for better month overview

        // Collapsed state tracking per month
        let collapsedMonths = JSON.parse(localStorage.getItem('weight_tracker_collapsed')) || {};

        // Load saved weights and notes from localStorage
        let weightData = JSON.parse(localStorage.getItem('weight_tracker_data')) || {};
        let weekNotes = JSON.parse(localStorage.getItem('weight_tracker_notes')) || {};

        // Format Date to String key (YYYY-MM-DD)
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Format Date nicely for display (e.g., "Oct 11")
        function formatDisplayDate(date) {
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // Format Month name for section header (e.g., "October 2026")
        function formatMonthName(date) {
            return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        // Toggle collapsing a specific month section
        function toggleMonth(monthId) {
            collapsedMonths[monthId] = !collapsedMonths[monthId];
            localStorage.setItem('weight_tracker_collapsed', JSON.stringify(collapsedMonths));
            renderApp();
        }

        // Collapse or expand all month sections
        function toggleAllMonths() {
            const monthKeys = Object.keys(currentMonthGroups);
            const allCollapsed = monthKeys.every(m => collapsedMonths[m]);
            monthKeys.forEach(m => {
                collapsedMonths[m] = !allCollapsed;
            });
            localStorage.setItem('weight_tracker_collapsed', JSON.stringify(collapsedMonths));
            renderApp();
        }

        // Scroll smoothly to a specific month or element
        function scrollToElement(id) {
            const el = document.getElementById(id);
            if (el) {
                // If collapsed, expand first
                if (collapsedMonths[id]) {
                    collapsedMonths[id] = false;
                    localStorage.setItem('weight_tracker_collapsed', JSON.stringify(collapsedMonths));
                    renderApp();
                }
                const element = document.getElementById(id);
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Jump directly to current week
        function scrollToCurrentWeek() {
            const todayKey = formatDateKey(new Date());
            const currentWeekEl = document.getElementById('currentWeekCard') || document.getElementById('weekCard_0');
            if (currentWeekEl) {
                currentWeekEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                currentWeekEl.classList.add('ring-2', 'ring-emerald-500');
                setTimeout(() => currentWeekEl.classList.remove('ring-2', 'ring-emerald-500'), 2500);
            }
        }

        // Save weight entry
        function saveWeight(dateKey, value) {
            if (value === '' || isNaN(value)) {
                delete weightData[dateKey];
            } else {
                weightData[dateKey] = parseFloat(value);
            }
            localStorage.setItem('weight_tracker_data', JSON.stringify(weightData));
            renderApp();
        }

        // Save note entry
        function saveNote(weekIndex, text) {
            if (text.trim() === '') {
                delete weekNotes[weekIndex];
            } else {
                weekNotes[weekIndex] = text;
            }
            localStorage.setItem('weight_tracker_notes', JSON.stringify(weekNotes));
        }

        // Increase total weeks count
        function changeWeeksCount(amount) {
            totalWeeks += amount;
            renderApp();
        }

        // Reset all data
        function resetData() {
            if (confirm('Are you sure you want to clear all logged weights and notes?')) {
                weightData = {};
                weekNotes = {};
                collapsedMonths = {};
                localStorage.removeItem('weight_tracker_data');
                localStorage.removeItem('weight_tracker_notes');
                localStorage.removeItem('weight_tracker_collapsed');
                renderApp();
            }
        }

        let currentMonthGroups = {};

        function renderApp() {
            const monthsContainer = document.getElementById('monthsContainer');
            const monthQuickNav = document.getElementById('monthQuickNav');
            monthsContainer.innerHTML = '';
            monthQuickNav.innerHTML = '';

            let previousWeekAverage = null;
            let currentStartDate = new Date(baseDate);

            // Structure to hold weeks grouped by Month Name
            currentMonthGroups = {};

            const today = new Date();
            const todayKey = formatDateKey(today);

            // Calculate dates and group weeks by month
            for (let w = 0; w < totalWeeks; w++) {
                const weekStartDate = new Date(currentStartDate);
                const weekEndDate = new Date(weekStartDate);
                weekEndDate.setDate(weekStartDate.getDate() + 6);

                const monthLabel = formatMonthName(weekStartDate);

                if (!currentMonthGroups[monthLabel]) {
                    currentMonthGroups[monthLabel] = [];
                }

                currentMonthGroups[monthLabel].push({
                    weekIndex: w,
                    startDate: weekStartDate,
                    endDate: weekEndDate
                });

                currentStartDate = new Date(weekEndDate);
                currentStartDate.setDate(weekEndDate.getDate() + 1);
            }

            // Update Toggle All Button text
            const monthKeys = Object.keys(currentMonthGroups);
            const allCollapsed = monthKeys.length > 0 && monthKeys.every(m => collapsedMonths[m]);
            document.getElementById('toggleAllBtn').innerText = allCollapsed ? '📂 Expand All' : '📁 Collapse All';

            // Render Month Jump Pills
            monthKeys.forEach((monthLabel, idx) => {
                const safeMonthId = `month_sec_${idx}`;
                const navBtn = document.createElement('button');
                navBtn.className = "px-3 py-1 bg-slate-100 hover:bg-blue-100 hover:text-blue-700 text-gray-700 text-xs font-semibold rounded-full transition border border-gray-200 whitespace-nowrap";
                navBtn.innerText = monthLabel;
                navBtn.onclick = () => scrollToElement(safeMonthId);
                monthQuickNav.appendChild(navBtn);
            });

            // Render each month section
            monthKeys.forEach((monthLabel, idx) => {
                const safeMonthId = `month_sec_${idx}`;
                const isCollapsed = collapsedMonths[safeMonthId];

                const monthSection = document.createElement('section');
                monthSection.id = safeMonthId;
                monthSection.className = "bg-white p-5 sm:p-6 rounded-2xl border border-gray-200 shadow-sm transition-all";

                // Month header (clickable to toggle collapse)
                const monthHeader = document.createElement('div');
                monthHeader.className = "flex items-center justify-between cursor-pointer select-none border-b border-gray-100 pb-3";
                monthHeader.onclick = () => toggleMonth(safeMonthId);

                monthHeader.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-6 bg-blue-600 rounded-full"></div>
                        <h2 class="text-xl font-bold text-gray-800">${monthLabel}</h2>
                        <span class="text-xs bg-slate-100 text-gray-500 font-medium px-2 py-0.5 rounded-full">${currentMonthGroups[monthLabel].length} Weeks</span>
                    </div>
                    <div class="flex items-center gap-2 text-gray-400 hover:text-gray-600 text-sm font-medium">
                        <span>${isCollapsed ? 'Expand ➕' : 'Collapse ➖'}</span>
                    </div>
                `;
                monthSection.appendChild(monthHeader);

                // Grid for week cards inside this month
                if (!isCollapsed) {
                    const weeksGrid = document.createElement('div');
                    weeksGrid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start mt-5";

                    monthGroups = currentMonthGroups;
                    monthGroups[monthLabel].forEach(weekInfo => {
                        const w = weekInfo.weekIndex;
                        const weekStartDate = weekInfo.startDate;
                        const weekEndDate = weekInfo.endDate;

                        const startStr = formatDisplayDate(weekStartDate);
                        const endStr = formatDisplayDate(weekEndDate);
                        const currentNote = weekNotes[w] || '';

                        let weekWeights = [];
                        let dayRowsHTML = '';
                        let isCurrentWeek = false;

                        for (let d = 0; d < 7; d++) {
                            const currentDate = new Date(weekStartDate);
                            currentDate.setDate(weekStartDate.getDate() + d);
                            const dateKey = formatDateKey(currentDate);
                            const dayDisplay = formatDisplayDate(currentDate);
                            const savedValue = weightData[dateKey] !== undefined ? weightData[dateKey] : '';

                            if (dateKey === todayKey) {
                                isCurrentWeek = true;
                            }

                            if (savedValue !== '') {
                                weekWeights.push(parseFloat(savedValue));
                            }

                            const isToday = dateKey === todayKey;

                            dayRowsHTML += `
                                <div class="flex items-center justify-between py-1.5 border-b border-gray-100 ${isToday ? 'bg-amber-50 px-1 rounded' : ''}">
                                    <span class="text-sm ${isToday ? 'font-bold text-amber-900' : 'text-gray-600'}">
                                        ${dayDisplay} ${isToday ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-1 rounded ml-1">Today</span>' : ''}
                                    </span>
                                    <div class="flex items-center gap-1">
                                        <input 
                                            type="number" 
                                            step="0.1" 
                                            placeholder="--" 
                                            value="${savedValue}"
                                            onchange="saveWeight('${dateKey}', this.value)"
                                            class="w-20 px-2 py-1 text-right text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                        <span class="text-xs text-gray-400">kg</span>
                                    </div>
                                </div>
                            `;
                        }

                        // Calculate week average
                        let currentWeekAvg = null;
                        if (weekWeights.length > 0) {
                            const sum = weekWeights.reduce((a, b) => a + b, 0);
                            currentWeekAvg = sum / weekWeights.length;
                        }

                        // Difference vs previous week average
                        let diffHTML = '';
                        if (currentWeekAvg !== null && previousWeekAverage !== null) {
                            const diff = currentWeekAvg - previousWeekAverage;
                            const diffFormatted = Math.abs(diff).toFixed(1);
                            if (diff > 0) {
                                diffHTML = `<div class="mt-2 text-xs font-semibold text-red-600 bg-red-50 p-2 rounded text-center">📈 +${diffFormatted} kg vs prev week</div>`;
                            } else if (diff < 0) {
                                diffHTML = `<div class="mt-2 text-xs font-semibold text-green-600 bg-green-50 p-2 rounded text-center">📉 -${diffFormatted} kg vs prev week</div>`;
                            } else {
                                diffHTML = `<div class="mt-2 text-xs font-semibold text-gray-600 bg-gray-50 p-2 rounded text-center">➖ No change vs prev week</div>`;
                            }
                        } else if (currentWeekAvg !== null && previousWeekAverage === null && w > 0) {
                            diffHTML = `<div class="mt-2 text-xs text-gray-400 text-center">No prev week data</div>`;
                        }

                        // Card element
                        const columnCard = document.createElement('div');
                        columnCard.id = isCurrentWeek ? 'currentWeekCard' : `weekCard_${w}`;
                        columnCard.className = `rounded-xl border p-4 flex flex-col justify-between transition shadow-sm ${
                            isCurrentWeek ? 'bg-amber-50/40 border-amber-300 ring-2 ring-amber-400/50' : 'bg-slate-50 border-gray-200 hover:border-gray-300'
                        }`;

                        columnCard.innerHTML = `
                            <div>
                                <div class="border-b border-gray-200 pb-2 mb-3 flex items-center justify-between">
                                    <span class="text-xs font-bold uppercase tracking-wider ${isCurrentWeek ? 'bg-amber-500 text-white' : 'bg-blue-100 text-blue-600'} px-2 py-0.5 rounded">
                                        ${isCurrentWeek ? '⭐ This Week' : 'Week ' + (w + 1)}
                                    </span>
                                    <h3 class="font-bold text-gray-800 text-sm">${startStr} – ${endStr}</h3>
                                </div>
                                <div class="mb-3">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Notes</label>
                                    <textarea 
                                        placeholder="Add notes for this week..." 
                                        onchange="saveNote(${w}, this.value)"
                                        oninput="saveNote(${w}, this.value)"
                                        class="w-full p-2 text-xs border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y min-h-[45px] text-gray-700 bg-white"
                                    >${currentNote}</textarea>
                                </div>
                                <div class="space-y-1 bg-white p-2 rounded-lg border border-gray-200">
                                    ${dayRowsHTML}
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-200">
                                <div class="flex justify-between items-center text-sm font-semibold">
                                    <span class="text-gray-700">Weekly Average:</span>
                                    <span class="text-blue-600">${currentWeekAvg !== null ? currentWeekAvg.toFixed(2) + ' kg' : 'No data'}</span>
                                </div>
                                ${diffHTML}
                            </div>
                        `;

                        weeksGrid.appendChild(columnCard);

                        if (currentWeekAvg !== null) {
                            previousWeekAverage = currentWeekAvg;
                        }
                    });

                    monthSection.appendChild(weeksGrid);
                }

                monthsContainer.appendChild(monthSection);
            });
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
